name: Release

# Cross-compiles the karta-core binary for every supported platform, packs each
# into its `@doc-karta/core-<platform>-<arch>` package, and publishes them plus the
# main `karta` package. Triggered by a `v*` tag (or manually).
#
# Requires the `NPM_TOKEN` repository secret. Not exercised by normal CI.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (e.g. 1.2.3)
        required: true

jobs:
  build-core:
    name: Build core (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-14, rust: aarch64-apple-darwin, bin: karta-core }
          - { target: darwin-x64, os: macos-13, rust: x86_64-apple-darwin, bin: karta-core }
          - { target: linux-x64, os: ubuntu-latest, rust: x86_64-unknown-linux-gnu, bin: karta-core }
          - { target: linux-arm64, os: ubuntu-latest, rust: aarch64-unknown-linux-gnu, bin: karta-core, cross: true }
          - { target: win32-x64, os: windows-latest, rust: x86_64-pc-windows-msvc, bin: karta-core.exe }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Cross linker (linux-arm64)
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release -p karta-core --target ${{ matrix.rust }} --locked
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.target }}
          path: target/${{ matrix.rust }}/release/${{ matrix.bin }}
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Resolve version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Place binaries into platform packages
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            src="artifacts/core-$target"
            dest="packages/karta/npm/$target"
            cp "$src"/karta-core* "$dest"/
            chmod +x "$dest"/karta-core* || true
          done

      - name: Stamp versions + wire optionalDependencies
        run: node scripts/prepare-publish.mjs "$VERSION"

      - name: Build UI
        run: pnpm --filter karta build

      - name: Publish platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            npm publish "packages/karta/npm/$target" --access public
          done

      - name: Publish karta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish packages/karta --access public
